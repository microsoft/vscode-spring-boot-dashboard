name: $(Date:yyyyMMdd).$(Rev:r)
variables:
  - name: Codeql.Enabled
    value: true
  - template: /.azp/npm-cfs-variables.yml@self
  - template: /.azp/maven-cfs-variables.yml@self
resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/main
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
trigger:
  branches:
    include:
      - main
extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      os: linux
      name: 1ES_JavaTooling_Pool
      image: 1ES_JavaTooling_Ubuntu-2004
    sdl:
      sourceAnalysisPool:
        name: 1ES_JavaTooling_Pool
        image: 1ES_JavaTooling_Windows_2022
        os: windows
    customBuildTags:
      - MigrationTooling-mseng-VSJava-9247-Tool
    stages:
      - stage: Build
        jobs:
          - job: Job_1
            displayName: Agent job 1
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: drop
                  targetPath: $(Build.ArtifactStagingDirectory)
                  displayName: "Publish Artifact: drop"
            steps:
              - checkout: self
                fetchTags: true
              - task: NodeTool@0
                displayName: Use Node 20.x
                inputs:
                  versionSpec: 20.x
              - template: /.azp/npm-cfs.yml@self
              - script: npm install
                displayName: npm install
                # Maven runs on this step only indirectly: npm install fires the
                # deprecated prepublish hook, which is scripts/build-java-ext.js and
                # ends in ./mvnw. If that hook is ever removed or moved to its own
                # step, this env block has to follow it, or the wrapper drops to an
                # unauthenticated fetch and fails on 401.
                #
                # System.AccessToken is a secret, and Azure Pipelines does not export secret
                # variables to the environment -- not even through a variable that merely
                # references one -- so it cannot live in maven-cfs-variables.yml alongside
                # the rest of the wiring.
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  MVNW_PASSWORD: $(System.AccessToken)
              - script: npm run tslint
                displayName: npm run tslint
              - script: npm run compile
                displayName: npm run compile
              - task: CmdLine@2
                displayName: Command Line Script
                inputs:
                  script: npx @vscode/vsce@latest package
              - task: CopyFiles@2
                displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
                inputs:
                  Contents: '*.vsix'
                  TargetFolder: $(Build.ArtifactStagingDirectory)
